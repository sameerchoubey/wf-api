# fly.toml app configuration file generated for wf-api on 2026-03-30T08:04:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Deploys: pushes to main deploy via GitHub Actions (.github/workflows/fly-deploy.yml),
# which needs the FLY_API_TOKEN repo secret. Manual deploy: `fly deploy` from repo root.
#
# Secrets (not in git — set once per app):
#   fly secrets set MONGO_URL="mongodb+srv://..." DB_NAME="wealthflow" JWT_SECRET="..." -a wf-api
#   fly secrets set CORS_ORIGINS="https://your-frontend.com,*" -a wf-api
#   fly secrets set CRYPTO_PRICE_API_KEY="..." -a wf-api   # FreeCryptoAPI token
#
# Local sanity check:
#   ./scripts/verify-build.sh

app = 'wf-api'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
